<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <style><![CDATA[
      .bg { fill: #ffffff; }
      .sym { fill: none; stroke: #000000; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .wire { fill: none; stroke: #000000; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .bus { fill: none; stroke: #000000; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .dash { fill: none; stroke: #000000; stroke-width: 2; stroke-dasharray: 8 7; }
      .thin { fill: none; stroke: #000000; stroke-width: 1.5; }
      .box { fill: none; stroke: #000000; stroke-width: 2.5; }
      .dot { fill: #000000; }
      .title { font: 700 28px Arial, Helvetica, sans-serif; }
      .subtitle { font: 400 15px Arial, Helvetica, sans-serif; }
      .label { font: 600 16px Arial, Helvetica, sans-serif; }
      .small { font: 400 14px Arial, Helvetica, sans-serif; }
      .tiny { font: 400 12px Arial, Helvetica, sans-serif; }
      .pin { font: 600 13px Arial, Helvetica, sans-serif; }
      .center { text-anchor: middle; }
      .right { text-anchor: end; }
    ]]></style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1200"/>

  <text x="800" y="42" class="title center">Phantasm — IEC 60617 Wiring Diagram</text>
  <text x="800" y="68" class="subtitle center">External wiring for the root sketch Narfduino_Phantasm.ino — 2P3T fire selector, NO trigger, NC pre-rev, separate NC MP5 safety</text>

  <g id="battery-g1">
    <text x="60" y="112" class="label center">G1</text>
    <text x="60" y="128" class="tiny center">4S LiPo</text>
    <line class="wire" x1="60" y1="140" x2="60" y2="88"/>
    <line class="wire" x1="60" y1="170" x2="60" y2="200"/>
    <line class="sym" x1="36" y1="140" x2="84" y2="140"/>
    <line class="sym" x1="44" y1="170" x2="76" y2="170"/>
    <text x="92" y="145" class="label">+</text>
    <text x="92" y="175" class="label">−</text>
  </g>

  <g id="switch-q1">
    <text x="260" y="110" class="label center">Q1 — SPST master power switch</text>
    <line class="wire" x1="60" y1="88" x2="186" y2="88"/>
    <line class="sym" x1="186" y1="88" x2="216" y2="88"/>
    <circle class="dot" cx="216" cy="88" r="3.5"/>
    <line class="sym" x1="219" y1="85" x2="268" y2="56"/>
    <circle class="dot" cx="282" cy="88" r="3.5"/>
    <line class="sym" x1="282" y1="88" x2="318" y2="88"/>
    <text x="216" y="128" class="tiny center">1</text>
    <text x="282" y="128" class="tiny center">2</text>
  </g>

  <g id="controller-a1">
    <rect class="box" x="650" y="110" width="320" height="850"/>
    <text x="810" y="145" class="label center">A1 — Narfduino Brushless Compleat</text>
    <text x="810" y="165" class="small center">ATmega328P assembly — external user wiring shown</text>
    <text x="810" y="185" class="tiny center">Internal flywheel/solenoid drive circuitry not expanded</text>

    <line class="sym" x1="650" y1="180" x2="600" y2="180"/>
    <line class="sym" x1="650" y1="230" x2="600" y2="230"/>
    <line class="sym" x1="650" y1="300" x2="600" y2="300"/>
    <line class="sym" x1="650" y1="350" x2="600" y2="350"/>
    <line class="sym" x1="970" y1="440" x2="1020" y2="440"/>
    <line class="sym" x1="650" y1="590" x2="600" y2="590"/>
    <line class="sym" x1="650" y1="720" x2="600" y2="720"/>
    <line class="sym" x1="650" y1="850" x2="600" y2="850"/>

    <text x="664" y="184" class="pin">B+</text>
    <text x="664" y="234" class="pin">B−</text>
    <text x="664" y="304" class="pin">D2 / PIN_SELECT_1</text>
    <text x="664" y="354" class="pin">D3 / PIN_SELECT_2</text>
    <text x="956" y="444" class="pin right">A3 / PIN_ENCODER_CLK</text>
    <text x="664" y="594" class="pin">D6 / PIN_TRIGGER</text>
    <text x="664" y="724" class="pin">D13 / PIN_PRE_REV</text>
    <text x="664" y="854" class="pin">A2 / PIN_MP5_SLAP</text>

    <line class="sym" x1="970" y1="220" x2="1020" y2="220"/>
    <line class="sym" x1="970" y1="490" x2="1020" y2="490"/>
    <line class="sym" x1="970" y1="540" x2="1020" y2="540"/>
    <line class="sym" x1="970" y1="700" x2="1020" y2="700"/>
    <line class="sym" x1="970" y1="750" x2="1020" y2="750"/>

    <text x="956" y="224" class="pin right">5V</text>
    <text x="956" y="494" class="pin right">D11 / PIN_ENCODER_DT</text>
    <text x="956" y="544" class="pin right">D12 / PIN_ENCODER_SW</text>
    <text x="956" y="704" class="pin right">A4 / SDA</text>
    <text x="956" y="754" class="pin right">A5 / SCL</text>

    <line class="sym" x1="810" y1="960" x2="810" y2="1010"/>
    <text x="830" y="990" class="pin">GND</text>
  </g>

  <g id="selector-s1">
    <rect class="box" x="130" y="220" width="420" height="340"/>
    <text x="340" y="248" class="label center">S1 — Fire selector, 2P3T slide switch</text>
    <text x="340" y="267" class="tiny center">Position 1 = Single, 2 = Burst, 3 = Full Auto</text>

    <rect class="thin" x="323" y="286" width="34" height="34" rx="4" ry="4"/>
    <line class="dash" x1="340" y1="320" x2="340" y2="520"/>
    <text x="340" y="341" class="tiny center">SLIDE</text>

    <text x="178" y="317" class="tiny right">Pos 1</text>
    <text x="178" y="357" class="tiny right">Pos 2</text>
    <text x="178" y="397" class="tiny right">Pos 3</text>
    <text x="178" y="457" class="tiny right">Pos 1</text>
    <text x="178" y="497" class="tiny right">Pos 2</text>
    <text x="178" y="537" class="tiny right">Pos 3</text>

    <text x="246" y="292" class="small center">Pole A → D2</text>
    <text x="246" y="432" class="small center">Pole B → D3</text>

    <line class="sym" x1="200" y1="315" x2="236" y2="315"/>
    <line class="sym" x1="200" y1="355" x2="236" y2="355"/>
    <line class="sym" x1="200" y1="395" x2="236" y2="395"/>
    <line class="sym" x1="270" y1="355" x2="322" y2="355"/>
    <line class="sym" x1="322" y1="355" x2="360" y2="355"/>
    <line class="wire" x1="360" y1="355" x2="550" y2="355"/>

    <line class="sym" x1="200" y1="455" x2="236" y2="455"/>
    <line class="sym" x1="200" y1="495" x2="236" y2="495"/>
    <line class="sym" x1="200" y1="535" x2="236" y2="535"/>
    <line class="sym" x1="270" y1="495" x2="322" y2="495"/>
    <line class="sym" x1="322" y1="495" x2="360" y2="495"/>
    <line class="wire" x1="360" y1="495" x2="550" y2="495"/>

    <line class="wire" x1="164" y1="315" x2="164" y2="550"/>
    <line class="wire" x1="164" y1="550" x2="200" y2="550"/>
    <text x="164" y="566" class="tiny center">GND rail</text>
    <line class="wire" x1="200" y1="315" x2="164" y2="315"/>
    <line class="wire" x1="200" y1="395" x2="164" y2="395"/>
    <line class="wire" x1="200" y1="495" x2="164" y2="495"/>
    <line class="wire" x1="200" y1="535" x2="164" y2="535"/>

    <line class="wire" x1="550" y1="355" x2="600" y2="300"/>
    <line class="wire" x1="550" y1="495" x2="570" y2="495"/>
    <line class="wire" x1="570" y1="495" x2="570" y2="350"/>
    <line class="wire" x1="570" y1="350" x2="600" y2="350"/>
  </g>

  <g id="trigger-s2">
    <text x="210" y="570" class="label center">S2 — Trigger microswitch (NO)</text>
    <line class="wire" x1="90" y1="610" x2="150" y2="610"/>
    <line class="sym" x1="150" y1="590" x2="150" y2="630"/>
    <line class="sym" x1="250" y1="610" x2="250" y2="630"/>
    <line class="sym" x1="250" y1="630" x2="168" y2="592"/>
    <line class="wire" x1="250" y1="610" x2="330" y2="610"/>
    <line class="wire" x1="330" y1="610" x2="390" y2="610"/>
    <line class="wire" x1="390" y1="610" x2="390" y2="590"/>
    <line class="wire" x1="390" y1="590" x2="600" y2="590"/>
    <text x="120" y="650" class="tiny center">NO → GND</text>
    <text x="290" y="650" class="tiny center">C → D6</text>
  </g>

  <g id="prerev-s3">
    <text x="210" y="700" class="label center">S3 — Pre-rev microswitch (NC)</text>
    <line class="wire" x1="90" y1="740" x2="150" y2="740"/>
    <line class="sym" x1="150" y1="720" x2="150" y2="760"/>
    <line class="sym" x1="250" y1="740" x2="250" y2="720"/>
    <line class="sym" x1="250" y1="720" x2="168" y2="740"/>
    <line class="wire" x1="250" y1="740" x2="330" y2="740"/>
    <line class="wire" x1="330" y1="740" x2="390" y2="740"/>
    <line class="wire" x1="390" y1="740" x2="390" y2="720"/>
    <line class="wire" x1="390" y1="720" x2="600" y2="720"/>
    <text x="120" y="780" class="tiny center">NC → GND</text>
    <text x="290" y="780" class="tiny center">C → D13</text>
  </g>

  <g id="mp5-s4">
    <text x="220" y="830" class="label center">S4 — MP5 slap safety microswitch (NC)</text>
    <line class="wire" x1="90" y1="870" x2="150" y2="870"/>
    <line class="sym" x1="150" y1="850" x2="150" y2="890"/>
    <line class="sym" x1="250" y1="870" x2="250" y2="850"/>
    <line class="sym" x1="250" y1="850" x2="168" y2="870"/>
    <line class="wire" x1="250" y1="870" x2="330" y2="870"/>
    <line class="wire" x1="330" y1="870" x2="390" y2="870"/>
    <line class="wire" x1="390" y1="870" x2="390" y2="850"/>
    <line class="wire" x1="390" y1="850" x2="600" y2="850"/>
    <text x="120" y="910" class="tiny center">NC → GND</text>
    <text x="290" y="910" class="tiny center">C → A2</text>
  </g>

  <g id="encoder-b1">
    <text x="1230" y="350" class="label center">B1 — KY-040 rotary encoder</text>
    <line class="sym" x1="1230" y1="364" x2="1230" y2="382"/>
    <circle class="sym" cx="1230" cy="470" r="62"/>
    <line class="sym" x1="1230" y1="408" x2="1230" y2="382"/>
    <line class="sym" x1="1240" y1="390" x2="1230" y2="382"/>
    <text x="1230" y="466" class="small center">ENC</text>
    <text x="1230" y="484" class="tiny center">incremental</text>

    <line class="wire" x1="1020" y1="440" x2="1168" y2="440"/>
    <line class="wire" x1="1168" y1="440" x2="1168" y2="430"/>
    <line class="wire" x1="1168" y1="430" x2="1190" y2="430"/>
    <text x="1198" y="422" class="tiny">CLK</text>

    <line class="wire" x1="1020" y1="490" x2="1160" y2="490"/>
    <line class="wire" x1="1160" y1="490" x2="1160" y2="470"/>
    <line class="wire" x1="1160" y1="470" x2="1190" y2="470"/>
    <text x="1198" y="462" class="tiny">DT</text>

    <line class="wire" x1="1020" y1="540" x2="1152" y2="540"/>
    <line class="wire" x1="1152" y1="540" x2="1152" y2="510"/>
    <line class="wire" x1="1152" y1="510" x2="1190" y2="510"/>
    <text x="1198" y="502" class="tiny">SW</text>

    <line class="wire" x1="1080" y1="430" x2="1270" y2="430"/>
    <text x="1278" y="422" class="tiny">+</text>

    <text x="1280" y="502" class="tiny">GND</text>
  </g>

  <g id="display-p1">
    <text x="1235" y="650" class="label center">P1 — 0.96&quot; I²C OLED, SSD1306</text>
    <rect class="box" x="1110" y="670" width="250" height="170" rx="10" ry="10"/>
    <rect class="thin" x="1160" y="700" width="150" height="70" rx="4" ry="4"/>
    <text x="1235" y="796" class="tiny center">Display module</text>

    <line class="wire" x1="1020" y1="700" x2="1110" y2="700"/>
    <text x="1120" y="692" class="tiny">SDA</text>

    <line class="wire" x1="1020" y1="750" x2="1110" y2="750"/>
    <text x="1120" y="742" class="tiny">SCL</text>

    <line class="wire" x1="1080" y1="720" x2="1360" y2="720"/>
    <text x="1328" y="712" class="tiny right">VCC</text>

    <text x="1328" y="752" class="tiny right">GND</text>
  </g>

  <g id="power-buses">
    <line class="wire" x1="318" y1="88" x2="580" y2="88"/>
    <line class="wire" x1="580" y1="88" x2="580" y2="180"/>
    <line class="wire" x1="580" y1="180" x2="600" y2="180"/>

    <line class="wire" x1="60" y1="200" x2="60" y2="210"/>
    <line class="wire" x1="60" y1="210" x2="110" y2="210"/>
    <line class="wire" x1="110" y1="210" x2="110" y2="230"/>
    <line class="wire" x1="110" y1="230" x2="600" y2="230"/>

    <line class="bus" x1="1020" y1="220" x2="1080" y2="220"/>
    <line class="bus" x1="1080" y1="220" x2="1080" y2="760"/>
    <text x="1092" y="236" class="label">+5 V</text>

    <line class="bus" x1="810" y1="1010" x2="810" y2="1030"/>
    <line class="bus" x1="70" y1="1030" x2="1490" y2="1030"/>
    <text x="84" y="1014" class="label">0 V / GND</text>

    <line class="sym" x1="70" y1="1030" x2="70" y2="1052"/>
    <line class="sym" x1="52" y1="1052" x2="88" y2="1052"/>
    <line class="sym" x1="56" y1="1062" x2="84" y2="1062"/>
    <line class="sym" x1="60" y1="1072" x2="80" y2="1072"/>

    <line class="wire" x1="164" y1="560" x2="164" y2="1030"/>
    <line class="wire" x1="90" y1="610" x2="90" y2="1030"/>
    <line class="wire" x1="90" y1="740" x2="90" y2="1030"/>
    <line class="wire" x1="90" y1="870" x2="90" y2="1030"/>

    <line class="wire" x1="1270" y1="510" x2="1270" y2="1030"/>
    <line class="wire" x1="1340" y1="760" x2="1340" y2="1030"/>
  </g>

  <g id="truth-table">
    <rect class="box" x="1085" y="885" width="420" height="120"/>
    <text x="1295" y="912" class="label center">S1 selector logic (matches root sketch)</text>
    <text x="1105" y="940" class="small">Position 1: D2 → GND, D3 open → Single</text>
    <text x="1105" y="963" class="small">Position 2: D2 open, D3 → GND → Burst</text>
    <text x="1105" y="986" class="small">Position 3: D2 → GND, D3 → GND → Full Auto</text>
    <text x="1105" y="1009" class="small">Fallback: D2 open, D3 open → Single (should not occur if S1 is wired correctly)</text>
  </g>

  <g id="notes">
    <text x="90" y="1125" class="small">Notes:</text>
    <text x="148" y="1125" class="small">All signal inputs use internal pull-ups; S2 pulls LOW when pressed, S3/S4 go HIGH when opened.</text>
    <text x="90" y="1147" class="small">S1 now selects fire mode only; firing inhibit is handled separately by S4 (MP5 slap safety) when that NC contact opens.</text>
    <text x="90" y="1169" class="small">This drawing shows external interconnects only; onboard ESC, tachometer, battery sensing, and solenoid bridge circuitry remain inside A1.</text>
  </g>
</svg>